version: "3.9"

services:
  # ── MongoDB ───────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: task-mgmt-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: task-management
    networks:
      - app-network

  # ── API ───────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: task-mgmt-api
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/task-management
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    depends_on:
      - mongo
    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge
